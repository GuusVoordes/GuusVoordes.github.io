<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Mijn Portfolio</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="projecten.html">Projecten</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="contact">
        <h2>Contact</h2>
        <p>
            Heb je een vraag of iets anders? Neem gerust contact met me op om te spreken!
        </p>

        <form id="contactFormulier" novalidate>
        <label for="naam">Naam:</label>
        <input 
        type="text" 
        id="naam"
        name="naam" 
        required
        aria-describedby="naam-error"
        aria-invalid="false">
        <span id="naam-error" role="alert"></span>


        <label for="email">Email:</label>
        <input 
        type="email"
        id="email"
        name="email"
        required
        aria-describedby="email-error"
        aria-invalid="false">
        <span id="email-error" role="alert"></span>

        <label for="bericht">Bericht:</label>
        <textarea 
        id="bericht"
        name="bericht"
        required
        aria-describedby="bericht-error"
        aria-invalid="false"
        ></textarea>
        <span id="bericht-error" role="alert"></span>

        <button type="submit">Verstuur</button>
     </form>

     <p id="melding"></p>
    </main>

    <footer>
      <h4>Guus Voordes</h4>
      <p>Altijd nieuwsgierig en op zoek naar plezier!</p>
      <p>Made in the Netherlands, 2026</p>
    </footer>
    <script src="js/contact.js"></script>
  </body>
</html>
